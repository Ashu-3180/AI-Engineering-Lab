[project]
name = "mini-gpt"
version = "0.1.0"
description = "Educational character-level language-model data foundation."
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = ["torch==2.15.0"]

[dependency-groups]
dev = ["pytest>=9.0,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
